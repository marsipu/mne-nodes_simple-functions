[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mne-nodes_simple-functions"
description = "These are some simple functions to get started with mne."
requires-python = ">=3.11"
dependencies = [
    "mne",
    "mne-nodes",
    "docutils",
]
dynamic = ["version"]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Martin G. Schulz", email = "dev@mgschulz.de" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/marsipu/mne-nodes_simple-functions"

[project.entry-points."mne_nodes.plugins"]
simple_functions = "mne_nodes_simple_functions"

[tool.hatch.build.targets.wheel]
packages = ["src/mne_nodes_simple_functions"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/LICENSE"]

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "release-branch-semver" }
fallback-version = "0.1.0"

[tool.ruff]
line-length = 88
fix = true
show-fixes = true
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true